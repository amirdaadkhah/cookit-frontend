<div class="hero">
  <button type="button" class="back-button" (click)="goBack()">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </button>

  <div class="hero-content">
    <div class="hero-copy">
      <span class="hero-label">
        ✦ MIXIWA generated
      </span>

      <h1>
        Your recipes are
        <span>ready to enjoy!</span>
      </h1>

      <p>
        We found
        <strong>{{ recipesCount }}</strong>
        delicious possibilities based on your selected ingredients.
      </p>

      <!-- Ingredients Summary -->
      <div class="ingredients-summary">
        <span>
          🧺
        </span>
        <strong>
          {{ payload.ingredientIds.length }} ingredients
        </strong>
        <button class="add-more-button" (click)="addMoreIngredients()">+ add more</button>
      </div>
    </div>
  </div>

  <div class="dish-img">
    <img [src]="getRecipeImageUrl()" alt="Generated recipe">
  </div>
</div>
