<div class="header-container">
  <!-- Left -->
  <ion-buttons class="actions">
    <ion-button class="icon" (click)="openMenu()"><ion-icon slot="icon-only" name="menu"></ion-icon>
    </ion-button>
    <ion-button fill="clear" class="icon" (click)="homeClicked()">
      <ion-icon name="home" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-buttons>

  <!-- Center -->
  <ion-img class="logo" [src]="logo" alt="bester logo">
  </ion-img>

  <!-- Right -->
  <ion-button class="icon" fill="clear" (click)="login()">
    <ion-icon slot="icon-only" name="person"></ion-icon>
  </ion-button>
</div>
