<!-- Selected Ingredients - desktop -->
<div class="desktop">
  <div class="cart">
    <div class="title">
      <span class="text">Your Ingredients</span>
      <span class="counter"> {{ this.cartService.cart.length }}</span>
    </div>
    <div class="line"></div>
    <div *ngFor="let item of (cartService.cart$ | async)" class="cart-item">
      <img [src]="item.part?.image ?? item.ingredient.image" [alt]="item.part?.name ?? item.ingredient.name">
      <div class="name">{{ item.ingredient.name }}
        <span *ngIf="item.part?.name"> - {{ item.part?.name }}</span>
      </div>
      <button (click)="removeFromCart(item)"><ion-icon name="close-circle"></ion-icon></button>
    </div>
  </div>
  <div>
    <app-recipes-mode-segment (segmentChange)="onSegmentChanged($event)"></app-recipes-mode-segment>
    <app-generate-recipe-button [disabled]="(cartService.cart$ | async)?.length === 0" [isLoading]="isGenerating"
      (generate)="generateRecipes()">
    </app-generate-recipe-button>
    <div class="match-tip">
      <ion-icon name="bulb-outline"></ion-icon>
      <div><strong>Tip</strong>
        <p>{{ matchTip }}</p>
      </div>
    </div>
  </div>
</div>

<!-- Selected Ingredients - Mobile -->
<div class="mobile">
  <app-recipes-mode-segment class="segment-mobile" (segmentChange)="onSegmentChanged($event)">
</app-recipes-mode-segment>
<button class="button" [disabled]="(cartService.cart$ | async)?.length === 0 || isGenerating"
  (click)="generateRecipes()">
  Generate Recipes
</button>
  <div class="cart-wrapper">
    <ion-icon class="cart-icon" name="cart-outline"></ion-icon>
    <ion-badge class="cart-badge">{{ (cartService.cart$ | async)?.length }}</ion-badge>
  </div>



</div>

<div class="match-tip">
  <ion-icon name="bulb-outline"></ion-icon>
  <div><strong>Tip</strong>
    <p>{{ matchTip }}</p>
  </div>
</div>

<!-- reusable loading component -->
<app-fantasy-spinner *ngIf="isGenerating" text="Creating magical recipes for you...">
</app-fantasy-spinner>

<!-- Error -->
<app-error-message *ngIf="generationError" title="Recipe generation failed" [message]="generationError"
  (close)="generationError = null">
</app-error-message>
