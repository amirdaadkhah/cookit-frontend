<ion-card>
  <ion-card-header>
    <ion-card-title>Steps</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <div class="step-input-row">
      <ion-item>
        <ion-label position="stacked">New Step</ion-label>
        <ion-textarea 
          [formControl]="stepInput" 
          rows="3" 
          placeholder="Enter one step at a time">
        </ion-textarea>
      </ion-item>

      <ion-button (click)="addStep()">Add Step</ion-button>
    </div>

    <div class="steps-list">
      <ion-card 
        class="step-card" 
        *ngFor="let step of stepsArray.controls; let i = index; trackBy: trackByIndex">
        <ion-card-content>
          <div class="step-row">
            <div class="step-text">
              <strong>Step {{ i + 1 }}</strong>
              <p>{{ step.value }}</p>
            </div>

            <div class="step-actions">
              <ion-button fill="clear" size="small" (click)="moveStepUp(i)">↑</ion-button>
              <ion-button fill="clear" size="small" (click)="moveStepDown(i)">↓</ion-button>
              <ion-button color="danger" fill="clear" size="small" (click)="removeStep(i)">Remove</ion-button>
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </ion-card-content>
</ion-card>
