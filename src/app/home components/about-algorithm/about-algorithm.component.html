<div class="container">
  <div class="title">What makes MIXIWA various:</div>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="4">
        <app-card 
          icon="basket-outline" 
          title="Add what you have" 
          description="Tell us what ingredients you already have in your kitchen, fridge, or pantry. Choose the items you want to use and build your ingredient list in just a few clicks.">
        </app-card>
      </ion-col>
      <ion-col size="12" size-md="4">
        <app-card 
          icon="search-outline" 
          title="We find recipes" 
          description="We compare your selected ingredients with available recipes and show you the best matches first, including recipes that need only a few extra ingredients.">
        </app-card>
      </ion-col>
      <ion-col size="12" size-md="4">
        <app-card 
          icon="heart-outline" 
          title="Cook & Enjoy" 
          description="Pick the recipe you like most, follow the cooking instructions step by step, and turn the ingredients you already have into a delicious meal.">
        </app-card>
      </ion-col>
    </ion-row>
  </ion-grid>
  <div class="demo-button">
    <button class="button" (click)="onStartDemo()">Start Demo Version</button>
  </div>
</div>
